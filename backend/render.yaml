databases:
  - name: csesa-db
    databaseName: csesa_db
    user: csesa_user

services:
  - type: web
    name: csesa-backend
    runtime: python3
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: csesa-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PORT
        value: 10000